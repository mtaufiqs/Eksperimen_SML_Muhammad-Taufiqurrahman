name: Preprocessing Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:   # bisa dijalankan manual dari GitHub

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn seaborn matplotlib jupyter

      - name: ⚙️ Jalankan preprocessing otomatis
        run: |
          python preprocessing/automate_Muhammad_Taufiqurrahman.py

      - name: 💾 Upload hasil preprocessing
        uses: actions/upload-artifact@v4
        with:
          name: dataset-preprocessed
          path: preprocessing/namadataset_preprocessing/
