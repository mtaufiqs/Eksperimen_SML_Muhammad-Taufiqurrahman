name: 📊 Preprocessing Pipeline Automation

on:
  workflow_dispatch:  # Bisa dijalankan manual dari VSCode / GitHub
  push:
    paths:
      - "preprocessing/automate_Muhammad-Taufiqurrahman.py"
      - "preprocessing/Telco-Customer-Churn_raw.csv"

jobs:
  preprocessing:
    name: Jalankan Otomasi Preprocessing
    runs-on: windows-latest  # Bisa diganti 'ubuntu-latest' kalau pakai Linux

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install Dependencies
        run: |
          pip install pandas numpy scikit-learn

      - name: ⚙️ Jalankan Script Preprocessing
        run: |
          python "./preprocessing/automate_Muhammad-Taufiqurrahman.py"

      - name: 📂 Verifikasi Hasil Output
        run: |
          echo "Berikut file hasil preprocessing yang dihasilkan:"
          dir "preprocessing/Telco-Customer-Churn_preprocessing"
